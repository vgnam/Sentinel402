name: Test and reproduce
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm run check
      - run: npm test
      - run: npm run demo:judge
      - run: npm run benchmark
      - run: npm run benchmark:systems
      - run: node research/experiments.mjs --seeds 402,403 --repetitions 3 --out artifacts/ci-experiments
      - uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.os }}
          path: artifacts/
